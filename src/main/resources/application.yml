spring:

  application:
    name: EcommerceBackend
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
#      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 2s
      timeout: 2s
