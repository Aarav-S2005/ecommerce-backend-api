spring:
  application:
    name: EcommerceBackend
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
#      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  ai:
    ollama:
      chat:
        model: qwen3:14b-q8_0
        temperature: 0.1
        num-ctx: 12288
        num-predict: 1024
        top-k: 20
        top-p: 0.8
        keep-alive: 10m
      base-url: http://localhost:11434

app:
  ai:
    max-tool-calling: 5
    max-history-messages: 10
      